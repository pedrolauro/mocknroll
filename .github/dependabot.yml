version: 2

updates:
  - package-ecosystem: "npm"
    cooldown:
      default-days: 7
    versioning-strategy: increase
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Keep Mockoon libs pinned to the forked version (9.6.1)
      - dependency-name: "@mockoon/commons"
      - dependency-name: "@mockoon/commons-server"
      - dependency-name: "*"
        # Ignore all major updates
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
